<!DOCTYPE html>
<html>

<head>

    <title>Registration Data</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 40px;
        }

        .container {
            width: 90%;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #667eea;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .update-btn {
            background-color: #ffc107;
            color: black;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .update-btn:hover {
            background-color: #e0a800;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Registration Data</h1>


    <table>

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>City</th>
            <th>Action</th>

        </tr>


        {% for registration in registrations %}

        <tr>

            <td>{{ registration.id }}</td>

            <td>{{ registration.name }}</td>

            <td>{{ registration.email }}</td>

            <td>{{ registration.phone }}</td>

            <td>{{ registration.city }}</td>


            <td>

                <!-- UPDATE BUTTON -->

                <a
                    href="{% url 'registration_update' registration.id %}"
                    class="update-btn"
                >
                    Update
                </a>


                <!-- DELETE BUTTON -->

                <form
                    method="POST"
                    action="{% url 'registration_delete' registration.id %}"
                    style="display: inline;"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="delete-btn"
                        onclick="return confirm('Are you sure you want to delete this record?');"
                    >
                        Delete
                    </button>

                </form>

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="6">
                No registration data found.
            </td>

        </tr>

        {% endfor %}


    </table>

</div>

</body>

</html>
