<!DOCTYPE html>
<html>

<head>

    <title>Update Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #5568d9;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Update Registration</h1>


    <form method="POST">

        {% csrf_token %}


        <label>Name</label>

        <input
            type="text"
            name="name"
            value="{{ registration.name }}"
            required
        >


        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ registration.email }}"
            required
        >


        <label>Phone</label>

        <input
        
            type="tel"
            name="phone"
            value="{{ registration.phone }}"
            maxlength="10"
            pattern="[0-9]{10}"
            title="Phone number must contain exactly 10 digits"
            required

        >


        <label>City</label>

        <input
            type="text"
            name="city"
            value="{{ registration.city }}"
            pattern="[A-Za-z ]+"
            title="City name should contain only letters"
            required
        >


        <button type="submit">
            Update Registration
        </button>

    </form>

</div>

</body>

</html>
