<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;

        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>
        

        <p class="subtitle">
            Please enter your details
        </p>
        {% if success_message %}
    <div class="success-message">
        ✅ {{ success_message }}
    </div>
{% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    value="{{ form_data.name }}"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    value="{{ form_data.email }}"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="tel"
                    name="phone"
                    value="{{ form_data.phone }}"
                    placeholder="Enter 10 digit phone number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    title="Phone number must contain exactly 10 digits"
                    required
                >
            </div>

            <div class="form-group">
                <label>City</label>
                <input
                   type="text"
                   name="city"
                   value="{{ form_data.city }}"
                   placeholder="Enter city name"
                   pattern="[A-Za-z ]+"
                   title="City name should contain only letters"
                   required

                >
            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <div class="footer">
            Registration System
        </div>

    </div>

</body>
</html>
